[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terminaltelemetry2"
version = "0.1.0"
description = "SSH terminal plus user-defined, TextFSM-driven telemetry widgets for network devices"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0-or-later" }
dependencies = [
    "PySide6>=6.5",
    "paramiko>=3.4,<5",  # 5.x strips legacy crypto handlers (ssh-rsa/SHA-1); breaks host-key verify on network gear
    "textfsm>=1.1.3",
    "click>=8.0",        # tfsm_fire uses click.echo for verbose output
    "PyYAML>=6.0",
]

[project.optional-dependencies]
# anytermqt wheels are built against an exact PySide6 (0.1.0 pins PySide6==6.10.3).
# Not on PyPI yet:
#   pip install -e ".[terminal]" --find-links https://github.com/scottpeterman/anytermqt/releases/expanded_assets/v0.1.0
terminal = ["anytermqt>=0.1.0"]
dev = ["pytest>=8"]

[project.scripts]
terminaltelemetry2 = "terminaltelemetry2.app:main"
tt2 = "terminaltelemetry2.app:main"

[tool.setuptools.packages.find]
include = ["terminaltelemetry2*"]

[tool.setuptools.package-data]
terminaltelemetry2 = ["data/*.db", "data/templates/*.textfsm", "data/widgets/*.yaml", "data/layouts/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
